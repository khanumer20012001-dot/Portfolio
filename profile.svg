<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
    <!-- Background Gradient (Subtle) -->
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#2a2a2a"/>
            <stop offset="100%" stop-color="#111111"/>
        </linearGradient>
        <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f0c2a5"/>
            <stop offset="100%" stop-color="#d69b76"/>
        </linearGradient>
    </defs>
    
    <!-- Transparent Background to fit seamlessly -->
    <rect width="400" height="400" fill="transparent" />

    <!-- Abstract Person Silhouette / Minimalist Avatar -->
    <g transform="translate(0, 30)">
        <!-- Shoulders / Torso -->
        <path d="M 50 370 C 50 250, 120 220, 200 220 C 280 220, 350 250, 350 370 Z" fill="#f4f4f4"/>
        
        <!-- Neck -->
        <rect x="180" y="160" width="40" height="70" fill="url(#skinGrad)" rx="10"/>

        <!-- Head -->
        <circle cx="200" cy="110" r="70" fill="url(#skinGrad)"/>

        <!-- Glasses (Since he has glasses in the photo) -->
        <path d="M 140 110 Q 170 110 170 130 Q 140 140 140 110 Z" fill="none" stroke="#222" stroke-width="6"/>
        <path d="M 260 110 Q 230 110 230 130 Q 260 140 260 110 Z" fill="none" stroke="#222" stroke-width="6"/>
        <path d="M 170 120 Q 200 110 230 120" fill="none" stroke="#222" stroke-width="4"/>

        <!-- Hair / Top -->
        <path d="M 135 110 C 130 50, 180 20, 200 30 C 220 20, 270 50, 265 110 C 240 70, 160 70, 135 110 Z" fill="#222222"/>
    </g>
</svg>
